<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtheriZ Webclient</title>
    <script type="module" crossorigin src="/assets/webclient-DuzlZcRs.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/xterm-Cu2-_v_-.js">
    <link rel="stylesheet" crossorigin href="/assets/xterm-D0uvttqg.css">
    <link rel="stylesheet" crossorigin href="/assets/webclient-BP-jSGSY.css">
  </head>
  <body>
    <main id="webclient">
      <section id="terminal-container" aria-label="AtheriZ terminal">
        <div id="left-terminal" class="terminal"></div>
        <div id="divider" role="separator" aria-label="Resize terminal panes"></div>
        <div id="right-terminal" class="terminal" hidden></div>
      </section>
      <section id="input-area-wrapper">
        <label class="sr-only" for="input-box">Command input</label>
        <textarea id="input-box" rows="1" placeholder="Enter command (Shift+Enter for new line)..."></textarea>
      </section>
    </main>
  </body>
</html>
