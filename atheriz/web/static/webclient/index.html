<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtheriZ Webclient</title>
    <link rel="preload" href="/static/assets/Fira_Custom-BSLiQCKK.ttf" as="font" type="font/ttf" crossorigin />
    <script type="module" crossorigin src="/static/assets/webclient-CYu75Nqd.js"></script>
    <link rel="modulepreload" crossorigin href="/static/assets/connection-CTg5h2jT.js">
    <link rel="stylesheet" crossorigin href="/static/assets/connection-wsl0qt4t.css">
    <link rel="stylesheet" crossorigin href="/static/assets/webclient-BTjSGQc-.css">
  </head>
  <body>
    <main id="webclient">
      <section id="terminal-container" aria-label="AtheriZ terminal">
        <div id="left-terminal" class="terminal"></div>
        <div id="divider" role="separator" aria-label="Resize terminal panes"></div>
        <div id="right-terminal" class="terminal" hidden></div>
      </section>
      <section id="input-area-wrapper">
        <label class="sr-only" for="input-box">Command input</label>
        <textarea id="input-box" rows="1" placeholder="Enter command (Shift+Enter for new line)..."></textarea>
      </section>
    </main>
  </body>
</html>
